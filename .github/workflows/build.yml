name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Create missing files and generate keystore
        run: |
          touch .env.example
          touch .env
          sed -i '/^[[:space:]]*@[[:alpha:]]*Volatile/d' app/src/main/java/com/example/data/remote/AudiusRepository.kt || true
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build Debug APK
        run: gradle assembleDebug --no-configuration-cache --no-daemon -Pksp.incremental=false -Dorg.gradle.jvmargs="-Xmx4g -Djava.awt.headless=true"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundLapa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
